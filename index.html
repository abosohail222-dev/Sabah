function hydrate(r){
 BID={};BNAME={};VER={};SNAP={};
 S={company:'Sabah',cur:'ر.س',branches:[],bi:{},mo:{},dmap:{}};
 r.st.forEach(x=>{if(x.key==='company')S.company=x.value;if(x.key==='currency')S.cur=x.value;if(x.key==='daftra_map'&&x.value&&typeof x.value==='object')S.dmap=x.value;if(x.key==='units'&&Array.isArray(x.value))S.units=x.value});
 r.br.forEach(b=>{BID[b.name]=b.id;BNAME[b.id]=b.name;S.branches.push(b.name);S.bi[b.name]=[]});
 r.it.forEach(x=>{const n=BNAME[x.branch_id];if(!n)return;S.bi[n]=x.items||[];VER['i|'+x.branch_id]=x.version;SNAP['i|'+x.branch_id]=JSON.stringify(S.bi[n])});
 r.mo.forEach(x=>{const n=BNAME[x.branch_id];if(!n)return;const k=`${n}|${x.y}|${x.m}`;S.mo[k]=x.data;mo(n,x.y,x.m);VER[k]=x.version;SNAP[k]=JSON.stringify(S.mo[k])});
 RO=ME.role==='owner';
 if(ME.role==='manager'||(br!==ALL&&!S.branches.includes(br))||(br===ALL&&!S.branches.length))br=S.branches[0];
}

async function conflictReload(b,k){
 const id=BID[b];
 if(k==='items'){const r=await DB.getItems(id);if(r){S.bi[b]=r.items||[];VER['i|'+id]=r.version;SNAP['i|'+id]=JSON.stringify(S.bi[b])}}
 else{const[,y,m]=k.split('|');const r=await DB.getMonth(id,+y,+m);if(r){S.mo[k]=r.data;mo(b,+y,+m);VER[k]=r.version;SNAP[k]=JSON.stringify(S.mo[k])}else{delete S.mo[k];delete VER[k];delete SNAP[k]}}
 msg='⚠ عدّل مستخدم آخر هذه البيانات أثناء عملك، فحُدّثت لآخر نسخة. راجع آخر إدخال لك وأعده إن لزم.';syncMsg='⚠ تعارض';render();
}
async function syncNow(){
 if(!SBON||RO||!ME)return;
 if(syncing){again=true;return}
 syncing=true;clearTimeout(syncT);let conf=false;
 try{
  for(const b of S.branches){const id=BID[b];if(!id)continue;
   const ik='i|'+id,js=JSON.stringify(IT(b));
   if(SNAP[ik]!==js&&!(SNAP[ik]===undefined&&js==='[]')){
    const v=await DB.saveItems(id,JSON.parse(js),VER[ik]||0);
    if(v===null||v===undefined){conf=true;await conflictReload(b,'items');continue}
    VER[ik]=v;SNAP[ik]=js}
  }
  for(const k of Object.keys(S.mo)){const[b,y,m]=k.split('|'),id=BID[b];if(!id)continue;const js=JSON.stringify(S.mo[k]);
   if(SNAP[k]===js)continue;
   if(SNAP[k]===undefined&&js===EMPTY)continue;
   const v=await DB.saveMonth(id,+y,+m,JSON.parse(js),VER[k]||0);
   if(v===null||v===undefined){conf=true;await conflictReload(b,k);continue}
   VER[k]=v;SNAP[k]=js}
  syncMsg=conf?'⚠ تعارض':'✔ تم الحفظ';
 }catch(e){syncMsg='⚠ تعذّر الحفظ: '+((e&&e.message)||e)}
 syncing=false;updSync();
 if(again){again=false;scheduleSync()}
}

const HDR=()=>SBON&&ME?`<span class="btn" id="syncst">${esc(RO?'عرض فقط':syncMsg)}</span><button class="btn" data-act="refresh" title="تحديث">🔄</button><span class="btn">${esc(ME.full_name||ME.email)} · ${ROLEN[ME.role]}</span><button class="btn" data-act="logout">خروج</button>`:`<button class="btn" data-act="seed">بيانات تجريبية</button><button class="btn" data-act="clear">مسح البيانات</button>`;
function TABX(){
 const allB=(!SBON||ME.role!=='manager')?`<button class="tab${br===ALL?' on':''}" style="--c:#7a4f2e" data-br="${ALL}">كل الفروع</button>`:'';
 const addB=(!SBON||ME.role==='admin')?(showAdd?`<input class="nb" id="nb" placeholder="اسم الفرع الجديد"><button class="pick" data-act="okBr">حفظ</button>`:`<button class="tab add" data-act="showAdd">＋ إضافة فرع</button>`):'';
 return allB+addB;
}
const NAVX=()=>{if(!SBON||!ME)return NAV;if(ME.role==='admin')return[...NAV,['users','المستخدمون والصلاحيات','👤','#364fc7'],['log','سجل العمليات','🕵️','#495057']];return NAV};
const loginUI=()=>`<div class="card" style="max-width:420px;margin:60px auto"><h2 style="text-align:center">🔐 تسجيل الدخول</h2><div class="fm" style="flex-direction:column;align-items:stretch"><label>البريد الإلكتروني<input id="lg_e" type="email" autocomplete="username" style="width:100%"></label><label>كلمة المرور<input id="lg_p" type="password" autocomplete="current-password" style="width:100%"></label>${authErr?`<div class="alert">${esc(authErr)}</div>`:''}${authOk?`<div class="alert" style="background:#d3f9d8;color:#087f5b">${esc(authOk)}</div>`:''}<button class="pick" data-act="login">دخول</button><button class="back" data-act="forgot">نسيت كلمة المرور؟ (اكتب بريدك أعلاه ثم اضغط)</button></div></div>`;
const recUI=()=>`<div class="card" style="max-width:420px;margin:60px auto"><h2 style="text-align:center">🔑 كلمة مرور جديدة</h2><div class="fm" style="flex-direction:column;align-items:stretch"><label>كلمة المرور الجديدة (8 أحرف على الأقل)<input id="rc_p" type="password" autocomplete="new-password" style="width:100%"></label><label>أعد كتابتها<input id="rc_p2" type="password" autocomplete="new-password" style="width:100%"></label>${authErr?`<div class="alert">${esc(authErr)}</div>`:''}<button class="pick" data-act="setNewPw">حفظ ودخول</button></div></div>`;
const pendingUI=()=>`<div class="card" style="max-width:480px;margin:60px auto;text-align:center"><h2>⏳ حسابك قيد الاعتماد</h2><p class="hint">سجّلت الدخول بـ ${esc(ME.email)} لكن لم تُحدَّد صلاحياتك بعد. تواصل مع المدير.</p><button class="back" data-act="logout">خروج</button></div>`;

/* ---------- المستخدمون (للمدير) ---------- */
async function loadUsers(){try{USERS=await DB.listUsers()}catch(e){msg='تعذّر تحميل المستخدمين: '+((e&&e.message)||'')}render()}
function pgUsers(){
 if(!ME||ME.role!=='admin')return ph('👤 المستخدمون')+`<div class="card"><p class="hint">هذه الصفحة للمدير فقط.</p></div>`;
 const bro=S.branches.map(b=>[BID[b],b]),rn=Object.entries(ROLEN);
 const rows=(USERS||[]).map(u=>{const me=u.id===ME.id;return`<tr><td>${esc(u.full_name||'—')}<small>${esc(u.email)}</small></td><td><select data-u="${u.id}:role" style="min-width:150px"${me?' disabled':''}><option value=""${!u.role?' selected':''}>غير معتمد</option>${rn.map(([k,n])=>`<option value="${k}"${u.role===k?' selected':''}>${n}</option>`).join('')}</select></td><td><select data-u="${u.id}:branch_id" style="min-width:130px"${u.role==='manager'&&!me?'':' disabled'}><option value="">—</option>${bro.map(([i,n])=>`<option value="${i}"${u.branch_id===i?' selected':''}>${esc(n)}</option>`).join('')}</select></td><td>${me?'<small>حسابك</small>':`<button class="back" data-act="pw:${u.id}">🔑 كلمة مرور</button> ${delFor===u.id?`<button class="pick" data-act="delU2:${u.id}">تأكيد الحذف</button> <button class="back" data-act="cancelU">إلغاء</button>`:`<button class="del" data-act="delU:${u.id}">🗑</button>`}`}</td></tr>`}).join('');
 const pwRow=pwFor?`<div class="card" style="border:3px solid #364fc7"><h3>🔑 كلمة مرور جديدة لـ ${esc(((USERS||[]).find(u=>u.id===pwFor)||{}).email||'')}</h3><div class="fm"><input id="pw_v" type="text" placeholder="8 أحرف على الأقل" style="width:240px"><button class="pick" data-act="okPw">حفظ</button><button class="back" data-act="cancelU">إلغاء</button></div></div>`:'';
 return ph('👤 المستخدمون والصلاحيات',btn('xlUsers','⬇ Excel')+' ')+`<div class="card"><h3>➕ إضافة مستخدم</h3><div class="fm"><label>الاسم<input id="nu_n" type="text"></label><label>البريد الإلكتروني<input id="nu_e" type="email" style="width:210px"></label><label>كلمة المرور (8 أحرف+)<input id="nu_p" type="text" style="width:170px"></label><label>الدور<select id="nu_r">${rn.map(([k,n])=>`<option value="${k}"${k==='manager'?' selected':''}>${n}</option>`).join('')}</select></label><label>الفرع (لمسؤول الفرع)<select id="nu_b">${bro.map(([i,n])=>`<option value="${i}">${esc(n)}</option>`).join('')}</select></label>${btn('addUser','＋ إضافة')}</div><p class="hint">مسؤول الفرع يرى ويعدّل فرعه فقط. المالك يرى كل الفروع والصفحات بدون تعديل. المدير له كل الصلاحيات. أعطِ المستخدم بريده وكلمة مروره، وسيدخل من نفس الرابط.</p></div>${pwRow}<div class="card"><h3>المستخدمون الحاليون</h3>${USERS?TB(TH('المستخدم')+TH('الدور','a')+TH('الفرع','b')+TH(''),rows||'<tr><td colspan="4">لا يوجد.</td></tr>'):'<p class="hint">⏳ جارٍ التحميل…</p>'}<p class="hint">يمكنك تغيير الدور أو الفرع مباشرة من القوائم، ويسري فوراً.</p></div>`;
}
async function addUser(){
 const g=id=>($('#'+id)||{}).value||'',role=g('nu_r'),body={action:'create',full_name:g('nu_n').trim(),email:g('nu_e').trim(),password:g('nu_p'),role,branch_id:role==='manager'?g('nu_b'):null};
 if(!body.email||!body.password){msg='أدخل البريد وكلمة المرور.';return render()}
 try{await DB.fn('admin-users',body);msg='تمت إضافة المستخدم '+body.email+'.';USERS=await DB.listUsers()}catch(e){msg='تعذّرت الإضافة: '+((e&&e.message)||'')}
 render();
}
async function okPw(){
 const v=($('#pw_v')||{}).value||'';
 try{await DB.fn('admin-users',{action:'set_password',id:pwFor,password:v});msg='تم تغيير كلمة المرور.';pwFor=null}catch(e){msg='تعذّر التغيير: '+((e&&e.message)||'')}
 render();
}
async function delUser(id){
 try{await DB.fn('admin-users',{action:'delete',id});msg='تم حذف المستخدم.';delFor=null;USERS=await DB.listUsers()}catch(e){msg='تعذّر الحذف: '+((e&&e.message)||'')}
 render();
}
async function userChange(i){
 const[id,f]=i.dataset.u.split(':'),u=(USERS||[]).find(x=>x.id===id);if(!u)return;
 const patch={};
 if(f==='role'){patch.role=i.value||null;if(i.value!=='manager')patch.branch_id=null;else if(!u.branch_id)patch.branch_id=BID[S.branches[0]]}
 else patch.branch_id=i.value||null;
 try{await DB.setUser(id,patch);Object.assign(u,patch);msg='تم حفظ الصلاحية.'+(f==='role'&&patch.role==='manager'&&!i.dataset.keep?' اختر الفرع المناسب لمسؤول الفرع.':'')}
 catch(e){msg='تعذّر الحفظ: '+((e&&e.message)||'')}
 render();
}

/* ---------- سجل العمليات (للمدير) ---------- */
async function loadAud(){try{AUD=await DB.listAudit()}catch(e){msg='تعذّر تحميل السجل: '+((e&&e.message)||'')}render()}
const ALAB={insert:'إنشاء',update:'تعديل',delete:'حذف',login:'دخول',user_create:'إضافة مستخدم',user_password:'تغيير كلمة مرور',user_delete:'حذف مستخدم'};
const KLAB={days:'المبيعات اليومية',stk:'الجرد',inv:'المصروفات والفواتير',pur:'مشتريات المخزون',ops:'المصروفات التشغيلية',sal:'الرواتب',dep:'الإهلاك',wb:'هالك البن',wk:'هالك المطبخ',xo:'بنود الدخل الإضافية',sk:'مبيعات المطبخ',sb:'مبيعات البن',items:'أصناف الجرد'};
function audTarget(t){const m=/^(\d{4})-(\d{2})$/.exec(t||'');return m?AR[+m[2]-1]+' '+m[1]:(t==='items'?'الأصناف':(t||''))}
function audDetail(r){
 const d=r.detail||{};
 if(r.action==='user_create')return `${d.email||''} (${ROLEN[d.role]||d.role||''})`;
 if(r.action==='user_delete')return d.email||'';
 if(r.action==='login'||r.action==='user_password')return '';
 const ch=(d.changed||[]).map(c=>{const l=KLAB[c.k]||c.k;if(c.from!==c.to)return `${l}: من ${c.from??'—'} إلى ${c.to??'—'}`;return c.n?`${l}: ${c.n} تعديل`:`${l}: تعديل`});
 return ch.join(' · ');
}
function pgLog(){
 if(!ME||ME.role!=='admin')return ph('🕵️ سجل العمليات')+`<div class="card"><p class="hint">هذه الصفحة للمدير فقط.</p></div>`;
 const A=(AUD||[]).filter(r=>(!audU||r.email===audU)&&(!audB||r.branch_id===audB)),us=[...new Set((AUD||[]).map(r=>r.email).filter(Boolean))];
 const tm=t=>new Date(t).toLocaleString('en-GB',{timeZone:'Asia/Riyadh',hour12:false,dateStyle:'short',timeStyle:'short'});
 const rows=A.map(r=>`<tr><td>${esc(tm(r.at))}</td><td>${esc(r.email||'—')}</td><td>${esc(BNAME[r.branch_id]||'—')}</td><td>${esc(ALAB[r.action]||r.action)} ${esc(audTarget(r.target))}</td><td style="text-align:start">${esc(audDetail(r))}</td></tr>`).join('');
 return ph('🕵️ سجل العمليات',btn('refreshLog','🔄 تحديث')+' '+btn('xlLog','⬇ Excel')+' ')+`<div class="card"><div class="fm"><label>المستخدم<select data-af="u"><option value="">الكل</option>${us.map(e=>`<option value="${esc(e)}"${e===audU?' selected':''}>${esc(e)}</option>`).join('')}</select></label><label>الفرع<select data-af="b"><option value="">الكل</option>${S.branches.map(b=>`<option value="${BID[b]}"${BID[b]===audB?' selected':''}>${esc(b)}</option>`).join('')}</select></label></div><p class="hint">يُكتب السجل تلقائياً من السيرفر عند كل إضافة أو تعديل أو حذف للبيانات (آخر 400 عملية)، ولا يمكن لأي مستخدم تعديله. الأوقات بتوقيت الرياض.</p>${AUD?TB(TH('الوقت')+TH('المستخدم','a')+TH('الفرع','b')+TH('العملية','c')+TH('التفاصيل','d'),rows||'<tr><td colspan="5">لا توجد عمليات.</td></tr>'):'<p class="hint">⏳ جارٍ التحميل…</p>'}</div>`;
}

boot();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
